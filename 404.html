<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jolpai Typing has moved</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://yeamin-talukder.github.io/jolpai-typing/" />
  <script>
    // Jolpai Type is now Jolpai Typing. Keep the rest of the address, the
    // query (shared profiles use ?p=) and the hash, then go to the new site.
    (function () {
      var NEW = 'https://yeamin-talukder.github.io/jolpai-typing/';
      var rest = location.pathname.replace(/^\/jolpai-type\/?/, '');
      if (rest === 'index.html' || rest === '404.html') rest = '';
      location.replace(NEW + rest + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://yeamin-talukder.github.io/jolpai-typing/" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1e2118; color: #d1d0c5;
      font: 16px/1.6 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    a { color: #a3b84a; }
  </style>
</head>
